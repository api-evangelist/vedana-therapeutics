aid: vedana-therapeutics
name: Vedana Therapeutics
description: >-
  Vedana Therapeutics is a clinical-stage biotechnology company developing
  next-generation medicines for migraine prevention. Founded by biotech investor
  Anurag Agarwal and antibody-development veteran Leon Garcia, the company emerged
  from stealth in June 2026 with a $46 million Series A co-led by Westlake
  BioPartners and Canaan Partners, with participation from Dawn Biopharma and
  Alexandria Venture Investments. Vedana is building a portfolio of long-acting,
  subcutaneously dosed monoclonal antibodies that go beyond CGRP by targeting
  PACAP (pituitary adenylate cyclase-activating peptide) and other CGRP-independent
  pathways, aiming to deliver complete and lasting relief for the majority of
  migraine patients who remain suboptimally controlled on current standard of
  care. Its preclinical pipeline includes VDN-0100 (anti-PACAP antibody, first-in-human
  planned 2027), VDN-0200 (PACAP x CGRP bispecific), and two undisclosed programs.
  This profile was surfaced as a portfolio company of Canaan Partners and added to
  the API Evangelist network. Vedana is a therapeutics company and publishes no
  public API or developer surface; this record captures its corporate identity for
  discovery.
